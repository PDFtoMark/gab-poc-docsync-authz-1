name: DocSync Authz PoC
on:
  issue_comment:
    types: [created]

jobs:
  docsync-comment:
    # Same gate as deriv-com/derivatives-smarttrader DocSyncAI.yml (no author check)
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@docbot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify PR Type
        id: verify-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          PR_DATA=$(gh api "/repos/$REPO_NAME/pulls/$PR_NUMBER")
          echo "pr_branch=$(echo "$PR_DATA" | jq -r .head.ref)" >> $GITHUB_OUTPUT
          echo "head_repo=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')" >> $GITHUB_OUTPUT
          echo "commenter=${{ github.event.comment.user.login }} assoc=${{ github.event.comment.author_association }}" >> $GITHUB_STEP_SUMMARY
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ steps.verify-pr.outputs.pr_branch }}
          fetch-depth: 0
      - name: Apply docbot instruction (stub for the Claude rewrite) and push
        env:
          INSTRUCTION: ${{ steps.verify-pr.outputs.instruction }}
          BRANCH: ${{ steps.verify-pr.outputs.pr_branch }}
        run: |
          set -e
          echo "checked out: $(git rev-parse --abbrev-ref HEAD) / $(git rev-parse --short HEAD)"
          echo "" >> README.md
          echo "<!-- docbot applied instruction from CANARY-untrusted-comment -->" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "DocSync AI: Update documentation from @docbot command"
          git push origin HEAD
          echo "pushed to $(git rev-parse --abbrev-ref HEAD) at $(git rev-parse --short HEAD)"
